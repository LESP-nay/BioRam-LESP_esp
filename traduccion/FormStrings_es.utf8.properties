#######################################################
# BioRAM: cadenas de la interfaz en espanol (Mexico).
#
# Este archivo se edita aqui, en UTF-8 y con acentos. El que se empaqueta en el
# .jar lo genera traduccion/empacar.py, que convierte los acentos a secuencias
# \uXXXX para que cualquier version de Java lo lea igual.
#
# Terminos fijos: question set = conjunto de preguntas; response set = conjunto
# de respuestas; Result Profile = perfil de resultados; chart = grafica;
# report = reporte; children = elementos secundarios; host = hospedador.
#######################################################

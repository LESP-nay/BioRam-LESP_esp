# ReportForm

ReportForm_InstructionsTab = Instrucciones
ReportForm_InstructionsIntro = El reporte se arma en dos partes: los conjuntos de preguntas y los conjuntos de resultados. Así se pueden usar varias combinaciones de conjuntos de respuestas para calcular los resultados sin tener que incluir, si no se desea, todas las preguntas y respuestas de cada conjunto que participa en esos resultados.
ReportForm_InstructionsQuestionsTab = Pestaña "Conjunto de preguntas": el reporte incluirá las respuestas (es decir, las preguntas con la respuesta que les corresponde en ese conjunto) de todos los conjuntos de respuestas que estén en la lista de abajo. Para agregar un conjunto de respuestas, seleccione en la lista de arriba el módulo al que pertenece, búsquelo en la segunda lista y haga clic en Agregar.
ReportForm_InstructionsResultsTab = Pestaña "Conjuntos de resultados": los conjuntos de respuestas que seleccione en esa pestaña determinan con qué datos se calculan los resultados (recuerde que cada resultado combina preguntas de varios módulos). Si selecciona varios conjuntos de respuestas de un mismo módulo, también se calculan todas las combinaciones de esos conjuntos con los demás módulos y sus conjuntos de respuestas.

